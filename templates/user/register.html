{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fivey | Create Account</title>
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="brand">
                <h2>Fivey</h2>
                <p>AI-powered food & health platform</p>
            </div>

            <div class="auth-header">
                <h1>Create your account</h1>
                <p>Start managing your food, nutrition and health with AI.</p>
            </div>

            {% if error %}
            <div class="alert error">
                {{ error }}
            </div>
            {% endif %}

            <form action="{% url 'register' %}" method="post">

                {% csrf_token %}

                <div class="form-grid">

                    <div class="input-group">
                        <label for="name">First Name</label>
                        <input id="name" type="text" name="name" placeholder="John" required>
                    </div>

                    <div class="input-group">
                        <label for="surname">Last Name</label>
                        <input id="surname" type="text" name="surname" placeholder="Doe">
                    </div>

                </div>

                <div class="input-group">
                    <label for="birth-date">Date of Birth</label>
                    <input id="birth-date" type="date" name="birth-date">
                </div>

                <div class="input-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" placeholder="Choose a username" required>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input id="email" type="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Create a secure password"
                        required>
                </div>

                <div class="input-group">
                    <label for="re-password">Confirm Password</label>
                    <input id="re-password" type="password" name="re-password" placeholder="Repeat your password"
                        required>
                </div>

                <button type="submit" class="primary-button">
                    Create Account
                </button>

            </form>

            <div class="auth-footer">
                <span>Already have an account?</span>
                <a href="{% url 'login' %}">
                    Sign In
                </a>
            </div>

        </div>

    </div>

</body>

</html>
