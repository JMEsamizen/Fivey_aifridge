{% load i18n_extras %}
<form method="post" action="{% url 'set_language' %}" class="lang-switch" aria-label="Language switcher">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.path }}">
    {% available_languages as langs %}
    <span class="lang-globe" aria-hidden="true">🌐</span>
    {% for code, labels in langs %}
        {% language_is code as active %}
        <button type="submit" name="language" value="{{ code }}"
                class="lang-btn{% if active %} active{% endif %}"
                title="{{ labels.1 }}">{{ labels.1 }}</button>
    {% endfor %}
</form>

<style>
    .lang-switch {
        position: fixed;
        top: 76px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3000;
        display: inline-flex;
        align-items: center;
        gap: 2px;
        padding: 5px 14px 5px 12px;
        background: rgba(255, 255, 255, 0.92);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(22, 35, 43, 0.12);
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(22, 35, 43, 0.14);
    }

    .lang-globe {
        font-size: 15px;
        line-height: 1;
        margin-right: 6px;
        filter: saturate(0.9);
    }

    .lang-btn {
        font-family: inherit;
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        color: #4e6672;
        background: transparent;
        border: none;
        padding: 8px 12px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease, transform 0.1s ease;
        white-space: nowrap;
    }

    .lang-btn:hover {
        color: #16232b;
        background: #eaf7fa;
        transform: translateY(-1px);
    }

    .lang-btn.active {
        color: #ffffff;
        background: #2e96b4;
    }

    @media (max-width: 640px) {
        .lang-switch {
            top: 12px;
            gap: 1px;
            padding: 4px 10px 4px 9px;
        }
        .lang-btn {
            padding: 7px 9px;
            font-size: 12px;
        }
    }
</style>
